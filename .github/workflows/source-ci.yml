name: Source CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'task/**'

permissions:
  contents: read

jobs:
  windows-source-contracts:
    name: Windows source contracts
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify static catalog contracts
        run: python -B test_static_catalog.py
      - name: Parse Windows entrypoints with PowerShell 5.1
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw 'Windows PowerShell 5.1 required' }
          @('Get-TunnelWindowsMirror.ps1','Repo1-Worker.ps1','Repo2-Worker.ps1','Start-ScriptCatalog.ps1','tools/Update-Windows-ControlCenter.ps1') | ForEach-Object {
            $path = (Resolve-Path $_).Path
            $tokens = $null; $errors = $null
            $null = [Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) { throw ('Syntax error in ' + $path) }
          }
      - name: Compile Script Catalog without starting GUI or workers
        run: powershell.exe -NoProfile -NonInteractive -STA -File .\Test-ScriptCatalogCompile.ps1
